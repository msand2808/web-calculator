<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="bootstrap.min .css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-body bg-dark text-white rounded">
                <h1 class="text-center ">Calculator</h1>

                <div class="container card mt-2 rounded">
                    <h2 class="mt-2 mb-2">Write a Expression:</h2>
                </div>


                <form action="">
                <div id="buttonsDiv">
                    <div class="d-flex justify-content-center mt-3">

                        <button id="btn7" class="btn btn-primary mx-2">7</button>
                        <button id="btn8" class="btn btn-primary mx-2">8</button>
                        <button  id="btn9" class="btn btn-primary mx-2">9</button>
                        <button  id="btnSub" class="btn btn-primary mx-2">-</button>
                        
                    </div>

                    <div class="d-flex justify-content-center mt-3">

                        <button id="btn4" class="btn btn-primary mx-2">4</button>
                        <button id="btn5" class="btn btn-primary mx-2">5</button>
                        <button id="btn6" class="btn btn-primary mx-2">6</button>
                        <button  id="btnSum" class="btn btn-primary mx-2">+</button>

                    </div>

                    <div class="d-flex justify-content-center mt-3">

                        <button id="btn1" class="btn btn-primary mx-2">1</button>
                        <button id="btn2" class="btn btn-primary mx-2">2</button>
                        <button id="btn3" class="btn btn-primary mx-2">3</button>
                        <button  id="btnMul" class="btn btn-primary mx-2">*</button>

                    </div>

                    <div class="d-flex justify-content-center mt-3">

                        <button id="btnClear" class="btn btn-primary mx-2">C</button>
                        <button id="btn0" class="btn btn-primary mx-2">0</button>
                        <button id="btnEqual" class="btn btn-primary mx-2">=</button>
                        <button  id="btnDiv" class="btn btn-primary mx-2">/</button>

                    </div>

                </div>

                </form>



            </div>
        </div>
    </div>
</body>

</html>
